name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # Keep app/package.json version in sync with the pushed tag (vX.Y.Z -> X.Y.Z)
      # so the installer filename and the title-bar version chip match the release.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node app/scripts/bump-version.cjs "$VERSION"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/package.json
          git commit -m "chore: bump version to $VERSION [skip ci]" || echo "no version change"

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build frontend & main process
        working-directory: ./app
        run: |
          npm run build
          npm run build:electron

      - name: Build Windows Executable & Installer
        working-directory: ./app
        run: npx electron-builder --win --config electron-builder.config.cjs --publish never

      - name: Upload Build Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/release/*.exe
            app/release/latest.yml
            app/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
